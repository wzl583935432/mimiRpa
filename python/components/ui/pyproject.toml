[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "components-ui"
version = "1.0.0"
description = "ui自动化"
authors = [
  { name="wzl", email="wzl0602@hotmail.com" },
]
readme = "README.md"
requires-python = ">=3.7"
dependencies = [           # 如果你的脚本依赖其他库，写在这里
    "components-base >= 1.0.0",
]

[project.entry-points."components.ui"]
click_element_activity = "ui_activity.click_element_activity:ClickElementActivity"

[tool.setuptools.packages.find]
where = ["."]
include = ["ui_activity*"]